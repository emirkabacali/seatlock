spring:
  application:
    name: seatlock
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seatlock}
    username: ${DB_USERNAME:seatlock}
    password: ${DB_PASSWORD:seatlock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
