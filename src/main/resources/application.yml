spring:
  application:
    name: seatlock
  config:
    # Local development: values from a git-ignored .env file (see .env.example).
    # Real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seatlock}
    username: ${DB_USERNAME:seatlock}
    password: ${DB_PASSWORD:seatlock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration

seatlock:
  security:
    jwt:
      # No default on purpose: the application refuses to start without a secret (min. 32 bytes).
      secret: ${JWT_SECRET:}
      issuer: seatlock
      ttl: ${JWT_TTL:PT1H}
    # Optional: creates an ADMIN account on startup if it does not exist yet.
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
