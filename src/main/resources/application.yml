spring:
  application:
    name: seatlock
  config:
    # Local development: values from a git-ignored .env file (see .env.example).
    # Real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/seatlock}
    username: ${DB_USERNAME:seatlock}
    password: ${DB_PASSWORD:seatlock}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Loads lazy collections for up to 50 parents in one query (avoids N+1 on booking seats).
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration

seatlock:
  security:
    jwt:
      # No default on purpose: the application refuses to start without a secret (min. 32 bytes).
      secret: ${JWT_SECRET:}
      issuer: seatlock
      ttl: ${JWT_TTL:PT1H}
    # Optional: creates an ADMIN account on startup if it does not exist yet.
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  booking:
    # How long seats stay HELD while a booking waits for payment.
    hold-duration: ${BOOKING_HOLD_DURATION:PT10M}
    # OPTIMISTIC (@Version) or PESSIMISTIC (SELECT ... FOR UPDATE). NAIVE is unsafe, for demonstration only.
    locking-strategy: ${BOOKING_LOCKING_STRATEGY:OPTIMISTIC}
    max-seats-per-booking: 10
    expiry-job:
      # Marks PENDING bookings whose hold has expired as EXPIRED and releases their seats.
      enabled: true
      interval: ${BOOKING_EXPIRY_INTERVAL:PT30S}
      batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
